# Comprobaciones automáticas en cada push y pull request, en los tres sistemas.
# No publica nada: solo compila y ejecuta las pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: NASM (OpenSSL de SQLCipher en Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pruebas en varias zonas horarias
        if: runner.os == 'Linux'
        run: npm run test:tz

      - name: Formato de Rust
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p chronos-core --release

      # Privacidad: la única conexión de red permitida es la de las actualizaciones
      # (tauri-plugin-updater, solo cuando el usuario la pide; ver docs/SECURITY.md).
      - name: Sin clientes de red salvo el actualizador
        shell: bash
        run: |
          NET='^(reqwest|hyper|ureq|surf|isahc|curl|h2|rustls|native-tls) '
          # 1. El núcleo (datos, cifrado, copias) no tiene ningún cliente de red.
          if cargo tree -p chronos-core -e normal --prefix none | sed 's/ (.*//' | sort -u | grep -Ei "$NET"; then
            echo "::error::chronos-core no puede depender de un cliente de red"; exit 1
          fi
          # 2. Sin contar el actualizador, la app de escritorio tampoco.
          if cargo tree -p chronos-desktop -e normal --prefix none --prune tauri-plugin-updater | sed 's/ (.*//' | sort -u | grep -Ei "$NET"; then
            echo "::error::Un cliente de red entra por una dependencia distinta del actualizador"; exit 1
          fi
          # 3. Y el cliente HTTP solo lo usa el actualizador.
          USERS=$(cargo tree -p chronos-desktop -e normal -i reqwest --depth 1 --prefix none | sed 's/ (.*//' | sort -u | grep -v '^reqwest ')
          if echo "$USERS" | grep -qv '^tauri-plugin-updater '; then
            echo "::error::reqwest lo usa algo más que el actualizador: $USERS"; exit 1
          fi
          echo "OK: la única vía de red es tauri-plugin-updater"
